<title>Neon Gym</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Neon Gym · Neon Inc family look (dark only, by design): deep night background, cyan for actions, magenta used only in the brand mark and progress glow.
   Layout: one narrow column; fixed bottom dock (rest timer + 4 tabs); each exercise is a compact row: tick + name, details in a dropdown. */
:root {
  --bg: #05050f;
  --bg-glow: #0d0b2a;
  --surface: #0d0e22;
  --surface-2: #14163a;
  --line: #23264a;
  --line-2: #33386a;
  --ink: #e9f3ff;
  --muted: #9aa3cc;
  --cyan: #00e5f4;
  --cyan-ink: #021216;
  --cyan-soft: rgba(0, 229, 244, .12);
  --magenta: #ff2bd6;
  --good: #3dffa2;
  --warn: #ffb547;
  --font-brand: "Orbitron", "Arial Black", sans-serif;
  --font-display: "Rajdhani", "Arial Narrow", sans-serif;
  --font-body: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg) radial-gradient(120% 60% at 50% -10%, var(--bg-glow) 0%, var(--bg) 60%) no-repeat;
  color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding-inline: 16px; padding-block: 0 160px; max-width: 640px; margin-inline: auto; min-height: 100%;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--cyan); }
:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
[hidden] { display: none !important; }

header.top { padding-block: 18px 8px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand svg { width: 34px; height: 34px; flex: none; filter: drop-shadow(0 0 6px rgba(0, 229, 244, .45)); }
.brand-t { font-family: var(--font-brand); font-weight: 900; font-size: 19px; letter-spacing: .12em; line-height: 1; }
.brand-s { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-top: 4px; }
.sync { font-size: 12px; color: var(--muted); text-align: right; white-space: nowrap; }
.sync::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--good); margin-right: 6px; vertical-align: 1px; }
.sync.bad::before { background: var(--warn); }

h2 { font-family: var(--font-display); font-size: 34px; font-weight: 700; line-height: 1; margin: 2px 0 0; text-wrap: balance; letter-spacing: .01em; }
h3 { font-family: var(--font-display); font-size: 22px; font-weight: 700; line-height: 1.15; margin: 0; }
.sub { color: var(--muted); font-size: 14px; margin: 6px 0 0; }
.small { font-size: 13px; color: var(--muted); margin: 0; }
.label { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin: 0; }
.stack { display: flex; flex-direction: column; gap: 8px; }
.sec { margin-top: 8px; display: flex; flex-direction: column; gap: 14px; }

.field {
  width: 100%; min-height: 46px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--surface); padding: 6px 12px; font-size: 16px; color: var(--ink);
}
select.field { appearance: auto; }
.daypick { display: flex; flex-direction: column; gap: 6px; }
.daypick label { font-size: 13px; color: var(--muted); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line-2); background: var(--surface); border-radius: 999px; padding: 7px 14px; min-height: 40px; font-weight: 600; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--cyan); border-color: var(--cyan); color: var(--cyan-ink); }

.meter { display: flex; flex-direction: column; gap: 8px; }
.meter .row-t { display: flex; justify-content: space-between; align-items: baseline; font-variant-numeric: tabular-nums; }
.meter .big { font-family: var(--font-display); font-size: 26px; font-weight: 700; line-height: 1; }
.meter .big span { font-size: 15px; color: var(--muted); font-weight: 600; }
.bar { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, var(--cyan), var(--magenta)); box-shadow: 0 0 12px rgba(255, 43, 214, .45); transition: width .3s; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.card p { margin: 0; font-size: 15px; }
.card ul, .card ol { margin: 0; padding-left: 20px; font-size: 15px; }
.card li { margin-bottom: 6px; }
.card li::marker { color: var(--cyan); }
.note { border: 1px solid rgba(255, 181, 71, .35); background: rgba(255, 181, 71, .07); color: var(--ink); padding: 10px 12px; border-radius: 10px; font-size: 14px; }
.note b { color: var(--warn); }

/* Exercise rows */
.row { display: grid; grid-template-columns: 54px 1fr; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; transition: border-color .2s, background .2s; }
.row.done { background: linear-gradient(90deg, rgba(0, 229, 244, .08), var(--surface) 60%); border-color: rgba(0, 229, 244, .35); }
.row.opt { border-style: dashed; }
.tickcell { display: flex; justify-content: center; padding-top: 12px; }
.tick {
  width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--line-2); background: transparent;
  color: transparent; font-size: 17px; font-weight: 800; line-height: 1; display: grid; place-items: center; transition: all .15s;
}
.tick:hover { border-color: var(--cyan); }
.row.done .tick { background: var(--cyan); border-color: var(--cyan); color: var(--cyan-ink); box-shadow: 0 0 14px rgba(0, 229, 244, .55); }
.row details { min-width: 0; }
.row summary { list-style: none; cursor: pointer; padding: 11px 14px 11px 0; min-height: 58px; display: flex; align-items: center; gap: 10px; }
.row summary::-webkit-details-marker { display: none; }
.row .nm { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.row .t { font-family: var(--font-display); font-size: 21px; font-weight: 700; line-height: 1.1; }
.row.done .t { color: var(--muted); }
.row .m { font-size: 13px; color: var(--muted); }
.row .cnt { font-family: var(--font-display); font-size: 16px; font-weight: 700; color: var(--cyan); font-variant-numeric: tabular-nums; white-space: nowrap; }
.row summary::after { content: ""; width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); margin: -4px 4px 0 0; flex: none; transition: transform .15s; }
.row details[open] summary::after { transform: rotate(-135deg); margin-top: 4px; border-color: var(--cyan); }
.body { padding: 2px 14px 16px 0; display: flex; flex-direction: column; gap: 12px; font-size: 15px; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line-2); font-variant-numeric: tabular-nums; }
.pill.hi { background: var(--cyan-soft); border-color: rgba(0, 229, 244, .4); color: var(--cyan); }
.how { margin: 0; font-size: 15px; }
.sug { font-size: 14px; font-weight: 600; color: var(--good); margin: 0; }
.sug.hold { color: var(--warn); }
.hist { font-size: 14px; color: var(--muted); margin: 0; font-variant-numeric: tabular-nums; }
.sets { display: flex; flex-direction: column; gap: 6px; }
.set, .sethead { display: grid; grid-template-columns: 22px 1fr 1fr 46px; gap: 6px; align-items: center; }
.sethead { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.sethead span:nth-child(n+2) { text-align: center; }
.sn { font-family: var(--font-display); font-weight: 700; color: var(--muted); text-align: center; }
.setin { width: 100%; min-height: 44px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--bg); padding: 4px 8px; text-align: center; font-size: 17px; font-variant-numeric: tabular-nums; color: var(--ink); }
.setin::placeholder { color: var(--muted); opacity: .6; }
.bwtag { text-align: center; font-size: 13px; color: var(--muted); }
.chk { height: 44px; border-radius: 10px; border: 2px solid var(--line-2); background: transparent; font-size: 19px; font-weight: 800; color: transparent; line-height: 1; }
.set.on .chk { background: var(--cyan); border-color: var(--cyan); color: var(--cyan-ink); }
.set.on .setin { border-color: rgba(0, 229, 244, .45); }
.link { align-self: flex-start; border: 0; background: transparent; color: var(--cyan); font-weight: 700; font-size: 14px; padding: 6px 0; min-height: 40px; }
.swapline { font-size: 14px; margin: 0; color: var(--muted); }
.swapline b { color: var(--ink); font-weight: 600; }
.btn {
  display: flex; align-items: center; justify-content: center; min-height: 46px; padding: 8px 14px; border: 1px solid rgba(0, 229, 244, .55);
  border-radius: 10px; color: var(--cyan); font-weight: 700; font-size: 15px; text-decoration: none; background: var(--cyan-soft); width: 100%; text-align: center;
}
.btn.solid { background: var(--cyan); color: var(--cyan-ink); border-color: var(--cyan); box-shadow: 0 0 18px rgba(0, 229, 244, .3); }
.btn.quiet { border-color: var(--line-2); color: var(--muted); background: transparent; }
.btnrow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.opts { display: flex; flex-direction: column; gap: 6px; }
.opt { text-align: left; border: 1px solid var(--line-2); background: var(--bg); border-radius: 10px; padding: 8px 12px; min-height: 48px; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 15px; }
.opt[disabled] { opacity: .45; cursor: default; }
.opt[aria-pressed="true"] { border-color: var(--cyan); background: var(--cyan-soft); font-weight: 700; }
.badge { font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; padding: 3px 8px; border: 1px solid var(--line-2); border-radius: 999px; color: var(--muted); white-space: nowrap; }
.badge.easy { border-color: rgba(61, 255, 162, .5); color: var(--good); }
.badge.later { border-color: rgba(255, 181, 71, .5); color: var(--warn); }
.badge.cur { border-color: var(--cyan); color: var(--cyan); }

details.fold { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
details.fold > summary { list-style: none; cursor: pointer; padding: 13px 16px; min-height: 50px; display: flex; justify-content: space-between; align-items: center; font-weight: 700; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::after { content: "+"; font-size: 22px; color: var(--cyan); font-weight: 600; }
details.fold[open] > summary::after { content: "–"; }
details.fold > .in { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 10px; font-size: 15px; }
details.fold ul, details.fold ol { margin: 0; padding-left: 20px; }
details.fold li { margin-bottom: 6px; }
details.fold li::marker { color: var(--cyan); }
.addlist { display: flex; flex-direction: column; }
.additem { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.additem .nm { min-width: 0; display: flex; flex-direction: column; }
.additem .nm b { font-weight: 600; }
.additem button { flex: none; min-height: 40px; padding: 0 16px; border-radius: 10px; border: 1px solid rgba(0, 229, 244, .55); background: var(--cyan-soft); color: var(--cyan); font-weight: 700; }
.additem button[disabled] { border-color: var(--line-2); color: var(--muted); background: transparent; }

.plan { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.plan.active { border-color: var(--cyan); box-shadow: 0 0 0 1px var(--cyan), 0 0 24px rgba(0, 229, 244, .15); }
.plan .top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.stage { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; font-weight: 800; color: var(--magenta); }
.plan p { margin: 0; font-size: 15px; }
.plan .sched { font-size: 14px; color: var(--muted); }
.daylist { display: flex; flex-direction: column; gap: 10px; }
.daylist div { font-size: 14px; color: var(--muted); }
.daylist b { font-weight: 700; display: block; color: var(--ink); }
.vol { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; }
.vol div { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; display: flex; flex-direction: column; }
.vol span { font-size: 12px; color: var(--muted); }
.vol b { font-family: var(--font-display); font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.vol .lo b { color: var(--warn); }

.row3 { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 10px; }
.fl { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); font-weight: 600; min-width: 0; }
.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
td.up { color: var(--good); font-weight: 700; }
.empty { color: var(--muted); font-size: 14px; margin: 0; }
.insight b { color: var(--cyan); font-weight: 700; }
svg.chart { width: 100%; height: auto; display: block; }
svg.chart text { fill: var(--muted); font-size: 10px; font-family: var(--font-body); }
svg.chart .gl { stroke: var(--line); stroke-width: 1; }
svg.chart .ln { stroke: var(--cyan); stroke-width: 2.5; fill: none; stroke-linejoin: round; stroke-linecap: round; filter: drop-shadow(0 0 4px rgba(0, 229, 244, .5)); }
svg.chart .dt { fill: var(--muted); opacity: .5; }
svg.chart .ep { fill: var(--magenta); }
svg.chart text.ev { fill: var(--ink); font-weight: 700; font-size: 11px; }
.entry { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 15px; font-variant-numeric: tabular-nums; }
.entry button { border: 0; background: transparent; color: var(--muted); min-height: 40px; padding: 0 8px; font-size: 14px; }
textarea.field { min-height: 90px; font-family: ui-monospace, monospace; font-size: 12px; resize: vertical; }
.src a { font-size: 14px; }

.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: rgba(5, 5, 15, .92); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.dock-in { max-width: 640px; margin: 0 auto; padding: 8px 16px; display: flex; flex-direction: column; gap: 8px; }
.timer { display: flex; align-items: center; gap: 10px; background: var(--surface-2); border: 1px solid var(--cyan); border-radius: 12px; padding: 6px 8px 6px 14px; box-shadow: 0 0 18px rgba(0, 229, 244, .25); }
.timer.go { border-color: var(--good); box-shadow: 0 0 18px rgba(61, 255, 162, .35); }
.timer .tl { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; font-weight: 800; color: var(--muted); }
.timer .tt { font-family: var(--font-display); font-size: 32px; font-weight: 700; flex: 1; font-variant-numeric: tabular-nums; line-height: 1; color: var(--cyan); }
.timer.go .tt { color: var(--good); }
.timer button { border: 1px solid var(--line-2); background: transparent; border-radius: 10px; min-height: 40px; padding: 0 12px; font-weight: 700; }
.toast { text-align: center; font-size: 14px; font-weight: 700; background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 10px; padding: 8px; }
.nav { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; }
.nav button { border: 0; background: transparent; border-radius: 10px; min-height: 50px; font-weight: 700; font-size: 13px; color: var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
.nav svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.nav button[aria-selected="true"] { color: var(--cyan); background: var(--cyan-soft); }
/* Food */
.datenav { display: grid; grid-template-columns: auto 1fr auto; align-items: end; gap: 8px; }
.datenav > div { text-align: center; }
.datenav .link[disabled] { opacity: .3; }
.mbar { display: flex; flex-direction: column; gap: 6px; }
.mbar .row-t { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-variant-numeric: tabular-nums; }
.mbar .mlab { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .12em; }
.mbar .mval { font-size: 14px; color: var(--muted); }
.mbar .mval b { font-family: var(--font-display); font-size: 18px; color: var(--ink); }
.mbar.big .mval b { font-size: 28px; }
.mbar.big .bar { height: 10px; }
.bar.over i { background: var(--warn); box-shadow: none; }
.mini { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tip { font-size: 14px; color: var(--muted); }
.tip b { color: var(--ink); }
.meal { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; }
.mhead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; padding: 2px 0 6px; }
.mhead b { font-family: var(--font-display); font-size: 19px; }
.fentry { display: grid; grid-template-columns: 1fr auto 40px; gap: 8px; align-items: center; padding: 7px 0; border-top: 1px solid var(--line); }
.fentry .nm, .fitem .nm { min-width: 0; display: flex; flex-direction: column; }
.fmac { display: flex; flex-direction: column; align-items: flex-end; font-variant-numeric: tabular-nums; white-space: nowrap; }
.fmac b { font-family: var(--font-display); font-size: 17px; color: var(--cyan); }
.fmac span { font-size: 12px; color: var(--muted); }
.fentry .x { min-height: 40px; border: 0; background: transparent; color: var(--muted); font-size: 18px; padding: 0; }
.addfood { gap: 12px; }
.flist { display: flex; flex-direction: column; }
.fitem { border-top: 1px solid var(--line); }
.fitem.open { background: var(--bg); border-radius: 10px; border-top-color: transparent; margin-block: 4px; }
.fhead { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 6px; min-height: 52px; border: 0; background: transparent; text-align: left; }
.fhead b { font-weight: 600; }
.fbody { padding: 0 8px 12px; display: flex; flex-direction: column; gap: 10px; }
.qty { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.qty button { width: 42px; height: 42px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface); font-size: 20px; font-weight: 700; }
.qty b { font-family: var(--font-display); font-size: 20px; }
.row4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.check { display: flex; gap: 8px; align-items: center; font-size: 14px; min-height: 40px; }
.check input { width: 20px; height: 20px; accent-color: var(--cyan); }
@media (max-width: 380px) { .row4 { grid-template-columns: 1fr 1fr; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

  </nav>
</div></div>

<script>
(function () {

function fixProfile() {
  var p = S.profile || {};
  if (!PLANS[p.plan]) p.plan = "fb";
  p.core = p.core || {};
  Object.keys(DAYS).forEach(function (d) { if (DAYS[d].core && !BY[p.core[d]]) p.core[d] = DAYS[d].core; });
  p.notes = p.notes || {};
  p.pick = p.pick || {};
  if (!p.start) p.start = dstr(monNum(todayStr()));
  p.myFoods = p.myFoods || []; p.targets = p.targets || {};
  S.profile = p; S.sessions = S.sessions || {}; S.body = S.body || {}; S.food = S.food || {};
  Object.keys(S.sessions).forEach(function (k) {
    var s = S.sessions[k];
    if (!s.day) s.day = s.wid || "A";
    if (!DAYS[s.day]) s.day = "A";
    if (!s.plan) s.plan = (s.day === "A" || s.day === "B") ? "fb" : p.plan;
    s.sets = s.sets || {}; s.done = s.done || {}; s.extras = s.extras || []; s.picks = s.picks || {};
  });
}
function cacheSave() { try { localStorage.setItem(LK, JSON.stringify(S)); } catch (e) {} }
function cacheLoad() {
  try { var r = localStorage.getItem(LK); if (r) { var o = JSON.parse(r); if (o && o.profile) S = o; } } catch (e) {}
  fixProfile();
}
function setSync(s) {
  var t = {local: "Saved on this phone", synced: "Saved", saving: "Saving…", error: "Not synced · kept on this phone"}[s] || "";
  var el = $("sync"); if (el) { el.textContent = t; el.className = "sync" + (s === "error" ? " bad" : ""); }
}
var pending = {}, chain = Promise.resolve(), tmr = null;
function mark(kind, key) {
  cacheSave();
  if (!DB) return;
  pending[kind + "|" + (key || "")] = 1;
  clearTimeout(tmr); tmr = setTimeout(flush, 700); setSync("saving");
}
function writeOne(k) {
  var p = k.split("|"), base = DB.doc("data/users/" + UID + "/profile");
  if (p[0] === "profile") return base.set(JSON.parse(JSON.stringify(S.profile)));
  if (p[0] === "session") { var d = base.collection("sessions").doc(p[1]); return S.sessions[p[1]] ? d.set(JSON.parse(JSON.stringify(S.sessions[p[1]]))) : d.delete(); }
  if (p[0] === "body") { var b = base.collection("body").doc(p[1]); return S.body[p[1]] ? b.set(JSON.parse(JSON.stringify(S.body[p[1]]))) : b.delete(); }
  if (p[0] === "food") { var fo = base.collection("food").doc(p[1]); return S.food[p[1]] ? fo.set(JSON.parse(JSON.stringify(S.food[p[1]]))) : fo.delete(); }
  return Promise.resolve();
}
function flush() {
  var keys = Object.keys(pending); pending = {};
  syncErr = false;
  keys.forEach(function (k) { chain = chain.then(function () { return writeOne(k); }).catch(function () { syncErr = true; }); });
  chain = chain.then(function () { setSync(syncErr ? "error" : "synced"); });
}
function markAll() {
