<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0c0e">
<meta name="description" content="Neon Gym: a beginner-friendly gym plan and log. Full body now, splits later, with weights, rest timer and progress tracking.">
<title>Neon Gym · Neon Inc™</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<script src="../neon-cloud.js"></script>
<style>html,body{margin:0}:root{padding-top:env(safe-area-inset-top,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Neon Gym · gym look (dark only, by design): near-black, flat cards, lime for actions, orange for food. Bebas Neue headings, Barlow text, mono tags.
   Layout: one narrow column; fixed bottom dock (rest timer + 4 tabs); each exercise is a compact row: tick + name, details in a dropdown. */
:root {
  /* Gym look: near-black, flat surfaces, one lime accent; orange marks food. */
  --bg: #0b0c0e;
  --surface: #131519;
  --surface-2: #1b1e23;
  --field: #0f1013;
  --line: #23262c;
  --line-2: #30343b;
  --ink: #f2f2ec;
  --muted: #8b9099;
  /* equipment colours */
  --eq-machine: #5ac8fa;
  --eq-cable: #b48cff;
  --eq-dumbbell: #ffb547;
  --eq-barbell: #ff6b6b;
  --eq-smith: #4fd1a5;
  --eq-body: #d5d8dc;
  --accent: #c8f542;
  --accent-ink: #0b0c0e;
  --accent-soft: color-mix(in srgb, var(--accent) 10%, transparent);
  --food: #ff8a3d;
  --good: #c8f542;
  --warn: #ffb547;
  --font-brand: "Bebas Neue", "Arial Narrow", sans-serif;
  --font-display: "Bebas Neue", "Arial Narrow", sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-padding-top: 76px; }
body {
  background: var(--bg);
  color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding-inline: 16px; padding-block: 0 160px; max-width: 640px; margin-inline: auto; min-height: 100%;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }

header.top { padding-block: 18px 8px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand svg { width: 34px; height: 34px; flex: none; }
.brand-t { font-family: var(--font-brand); font-weight: 400; font-size: 19px; letter-spacing: .12em; line-height: 1; }
.brand-s { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-top: 4px; }
.sync { font-size: 12px; color: var(--muted); text-align: right; white-space: nowrap; }
.sync::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--good); margin-right: 6px; vertical-align: 1px; }
.sync.bad::before { background: var(--warn); }
.sync.off { color: var(--text); text-decoration: underline; text-underline-offset: 3px; }
.sync.off::before { background: var(--muted); }

h2 { font-family: var(--font-display); font-size: 34px; font-weight: 400; line-height: 1; margin: 2px 0 0; text-wrap: balance; letter-spacing: .01em; }
h3 { font-family: var(--font-display); font-size: 22px; font-weight: 400; line-height: 1.15; margin: 0; }
.sub { color: var(--muted); font-size: 14px; margin: 6px 0 0; }
.small { font-size: 13px; color: var(--muted); margin: 0; }
.label { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin: 0; }
.stack { display: flex; flex-direction: column; gap: 8px; }
.sec { margin-top: 8px; display: flex; flex-direction: column; gap: 14px; }

.field {
  width: 100%; min-height: 46px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--surface); padding: 6px 12px; font-size: 16px; color: var(--ink);
}
select.field { appearance: auto; }
.daypick { display: flex; flex-direction: column; gap: 6px; }
.daypick label { font-size: 13px; color: var(--muted); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line-2); background: var(--surface); border-radius: 6px; padding: 7px 14px; min-height: 40px; font-weight: 600; font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

.meter { display: flex; flex-direction: column; gap: 8px; }
.meter .row-t { display: flex; justify-content: space-between; align-items: baseline; font-variant-numeric: tabular-nums; }
.meter .big { font-family: var(--font-display); font-size: 26px; font-weight: 400; line-height: 1; }
.meter .big span { font-size: 15px; color: var(--muted); font-weight: 600; }
.bar { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 4px; background: var(--accent); transition: width .3s; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.card p { margin: 0; font-size: 15px; }
.card ul, .card ol { margin: 0; padding-left: 20px; font-size: 15px; }
.card li { margin-bottom: 6px; }
.card li::marker { color: var(--accent); }
.note { border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent); background: color-mix(in srgb, var(--warn) 7%, transparent); color: var(--ink); padding: 10px 12px; border-radius: 10px; font-size: 14px; }
.note b { color: var(--warn); }

/* Exercise rows */
.row { display: grid; grid-template-columns: 54px 1fr; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; transition: border-color .2s, background .2s; }
.row.done { background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 8%, transparent), var(--surface) 60%); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
.row.optional { border-style: dashed; }
.tickcell { display: flex; justify-content: center; padding-top: 12px; }
.tick {
  width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--line-2); background: transparent;
  color: transparent; font-size: 17px; font-weight: 800; line-height: 1; display: grid; place-items: center; transition: all .15s;
}
.tick:hover { border-color: var(--accent); }
.row.done .tick { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.row details { min-width: 0; }
.row summary { list-style: none; cursor: pointer; padding: 11px 14px 11px 0; min-height: 58px; display: flex; align-items: center; gap: 10px; }
.row summary::-webkit-details-marker { display: none; }
.row .nm { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.row .t { font-family: var(--font-display); font-size: 21px; font-weight: 400; line-height: 1.1; }
.row.done .t { color: var(--muted); }
.row .m { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.eqt { --c: var(--eq-machine); display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; letter-spacing: .04em; color: var(--c); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); background: color-mix(in srgb, var(--c) 10%, transparent); border-radius: 6px; padding: 1px 8px 1px 6px; white-space: nowrap; }
.eqt::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
.eqt.cable { --c: var(--eq-cable); } .eqt.dumbbell { --c: var(--eq-dumbbell); } .eqt.barbell { --c: var(--eq-barbell); } .eqt.smith { --c: var(--eq-smith); } .eqt.bodyweight { --c: var(--eq-body); }
.row .cnt { font-family: var(--font-display); font-size: 16px; font-weight: 400; color: var(--accent); font-variant-numeric: tabular-nums; white-space: nowrap; }
.row summary::after { content: ""; width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); margin: -4px 4px 0 0; flex: none; transition: transform .15s; }
.row details[open] summary::after { transform: rotate(-135deg); margin-top: 4px; border-color: var(--accent); }
.body { padding: 2px 14px 16px 0; display: flex; flex-direction: column; gap: 12px; font-size: 15px; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill { font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line-2); font-variant-numeric: tabular-nums; }
.pill.hi { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 40%, transparent); color: var(--accent); }
.how { margin: 0; font-size: 15px; }
.sug { font-size: 14px; font-weight: 600; color: var(--good); margin: 0; }
.sug.hold { color: var(--warn); }
.hist { font-size: 14px; color: var(--muted); margin: 0; font-variant-numeric: tabular-nums; }
.sets { display: flex; flex-direction: column; gap: 6px; }
.set, .sethead { display: grid; grid-template-columns: 22px 1fr 1fr 46px; gap: 6px; align-items: center; }
.sethead { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.sethead span:nth-child(n+2) { text-align: center; }
.sn { font-family: var(--font-display); font-weight: 400; color: var(--muted); text-align: center; }
.setin { width: 100%; min-height: 44px; border: 1px solid var(--line-2); border-radius: 10px; background: var(--field); padding: 4px 8px; text-align: center; font-size: 17px; font-variant-numeric: tabular-nums; color: var(--ink); }
.setin::placeholder { color: var(--muted); opacity: .6; }
.bwtag { text-align: center; font-size: 13px; color: var(--muted); }
.chk { height: 44px; border-radius: 10px; border: 2px solid var(--line-2); background: transparent; font-size: 19px; font-weight: 800; color: transparent; line-height: 1; }
.set.on .chk { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.set.on .setin { border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
.link { align-self: flex-start; border: 0; background: transparent; color: var(--accent); font-weight: 700; font-size: 14px; padding: 6px 0; min-height: 40px; }
.swapline { font-size: 14px; margin: 0; color: var(--muted); }
.swapline b { color: var(--ink); font-weight: 600; }
.btn {
  display: flex; align-items: center; justify-content: center; min-height: 46px; padding: 8px 14px; border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent);
  border-radius: 10px; color: var(--accent); font-weight: 700; font-size: 15px; text-decoration: none; background: var(--accent-soft); width: 100%; text-align: center;
}
.btn.solid { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.quiet { border-color: var(--line-2); color: var(--muted); background: transparent; }
.btnrow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.opts { display: flex; flex-direction: column; gap: 6px; }
.opt > span:first-child { flex: 1; min-width: 0; }
.opt { text-align: left; border: 1px solid var(--line-2); background: var(--bg); border-radius: 10px; padding: 8px 12px; min-height: 48px; display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 15px; }
.opt[disabled] { opacity: .45; cursor: default; }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); font-weight: 700; }
.badge { font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; padding: 3px 8px; border: 1px solid var(--line-2); border-radius: 6px; color: var(--muted); white-space: nowrap; }
.badge.easy { border-color: color-mix(in srgb, var(--accent) 50%, transparent); color: var(--good); }
.badge.later { border-color: color-mix(in srgb, var(--warn) 50%, transparent); color: var(--warn); }
.badge.cur { border-color: var(--accent); color: var(--accent); }

details.fold { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
details.fold > summary { list-style: none; cursor: pointer; padding: 13px 16px; min-height: 50px; display: flex; justify-content: space-between; align-items: center; font-weight: 700; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::after { content: "+"; font-size: 22px; color: var(--accent); font-weight: 600; }
details.fold[open] > summary::after { content: "–"; }
details.fold > .in { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 10px; font-size: 15px; }
details.fold ul, details.fold ol { margin: 0; padding-left: 20px; }
details.fold li { margin-bottom: 6px; }
details.fold li::marker { color: var(--accent); }
.addlist { display: flex; flex-direction: column; }
.additem { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.additem .nm { min-width: 0; display: flex; flex-direction: column; }
.additem .nm b { font-weight: 600; }
.additem-m { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: center; margin-top: 2px; }
.eqchips .chip { min-height: 34px; padding: 4px 12px; font-size: 13px; }
.additem button { flex: none; min-height: 40px; padding: 0 16px; border-radius: 10px; border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent); background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.additem button[disabled] { border-color: var(--line-2); color: var(--muted); background: transparent; }

.plan { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.plan.active { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.plan .top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.stage { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; font-weight: 800; color: var(--food); }
.plan p { margin: 0; font-size: 15px; }
.plan .sched { font-size: 14px; color: var(--muted); }
.daylist { display: flex; flex-direction: column; gap: 10px; }
.daylist div { font-size: 14px; color: var(--muted); }
.daylist b { font-weight: 700; display: block; color: var(--ink); }
.vol { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 6px; }
.vol div { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; display: flex; flex-direction: column; }
.vol span { font-size: 12px; color: var(--muted); }
.vol b { font-family: var(--font-display); font-size: 20px; font-weight: 400; font-variant-numeric: tabular-nums; line-height: 1.1; }
.vol .lo b { color: var(--warn); }

.row3 { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 10px; }
.fl { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); font-weight: 600; min-width: 0; }
.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
td.up { color: var(--good); font-weight: 700; }
.empty { color: var(--muted); font-size: 14px; margin: 0; }
.insight b { color: var(--accent); font-weight: 700; }
svg.chart { width: 100%; height: auto; display: block; }
svg.chart text { fill: var(--muted); font-size: 10px; font-family: var(--font-body); }
svg.chart .gl { stroke: var(--line); stroke-width: 1; }
svg.chart .ln { stroke: var(--accent); stroke-width: 2.5; fill: none; stroke-linejoin: round; stroke-linecap: round; }
svg.chart .dt { fill: var(--muted); opacity: .5; }
svg.chart .ep { fill: var(--food); }
svg.chart text.ev { fill: var(--ink); font-weight: 700; font-size: 11px; }
.entry { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 15px; font-variant-numeric: tabular-nums; }
.entry button { border: 0; background: transparent; color: var(--muted); min-height: 40px; padding: 0 8px; font-size: 14px; }
textarea.field { min-height: 90px; font-family: ui-monospace, monospace; font-size: 12px; resize: vertical; }
.src a { font-size: 14px; }

.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: rgba(21, 24, 29, .94); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.dock-in { max-width: 640px; margin: 0 auto; padding: 8px 16px; display: flex; flex-direction: column; gap: 8px; }
.timer { display: flex; align-items: center; gap: 10px; background: var(--surface-2); border: 1px solid var(--accent); border-radius: 7px; padding: 6px 8px 6px 14px; }
.timer.go { border-color: var(--good); }
.timer .tl { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; font-weight: 800; color: var(--muted); }
.timer .tt { font-family: var(--font-display); font-size: 32px; font-weight: 400; flex: 1; font-variant-numeric: tabular-nums; line-height: 1; color: var(--accent); }
.timer.go .tt { color: var(--good); }
.timer button { border: 1px solid var(--line-2); background: transparent; border-radius: 10px; min-height: 40px; padding: 0 12px; font-weight: 700; }
.toast { text-align: center; font-size: 14px; font-weight: 700; background: var(--surface-2); border: 1px solid var(--line-2); border-radius: 10px; padding: 8px; }
.nav { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; }
.nav button { border: 0; background: transparent; border-radius: 10px; min-height: 50px; font-weight: 700; font-size: 13px; color: var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
.nav svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.nav button[aria-selected="true"] { color: var(--accent); background: var(--accent-soft); }
.nav button.fnav { color: color-mix(in srgb, var(--food) 75%, var(--muted)); border-left: 1px solid var(--line); border-radius: 0 10px 10px 0; }
.nav button.fnav[aria-selected="true"] { color: var(--food); background: color-mix(in srgb, var(--food) 12%, transparent); }
.hbtns { display: flex; align-items: center; gap: 10px; }
.hguide { width: 40px; height: 40px; border-radius: 7px; border: 1px solid var(--line-2); background: var(--surface); display: grid; place-items: center; color: var(--muted); flex: none; }
.hguide svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.hguide[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
/* Workout: header, finish, picker, exercise tabs */
.wkhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.wkhead > div { min-width: 0; }
.chg { flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: 6px; border: 1px solid color-mix(in srgb, var(--accent) 50%, transparent); background: var(--accent-soft); color: var(--accent); font-weight: 700; font-size: 14px; margin-top: 18px; }
.chg svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.finbtn { gap: 8px; min-height: 54px; font-size: 17px; background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.finbtn svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.finhero { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; padding-top: 4px; }
.finhero svg, .finrow svg { width: 56px; height: 56px; fill: none; stroke: var(--good); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.finhero p { margin: 0; font-size: 16px; font-weight: 600; max-width: 30ch; }
.finrow { display: flex; align-items: center; gap: 12px; }
.finrow svg { width: 44px; height: 44px; flex: none; }
.fincard { border-color: color-mix(in srgb, var(--accent) 45%, transparent); background: linear-gradient(160deg, color-mix(in srgb, var(--accent) 8%, transparent), var(--surface) 55%); }
.ptiles.wk .hi { border-color: color-mix(in srgb, var(--accent) 50%, transparent); background: var(--accent-soft); }
.ptiles.wk .hi b { color: var(--accent); }
.ptiles b small { font-size: 13px; color: var(--muted); font-weight: 600; margin-left: 1px; }
.leftlist { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.leftlist .label, .leftlist .small { flex-basis: 100%; }
.leftlist span { font-size: 13px; padding: 4px 10px; border-radius: 6px; border: 1px dashed var(--line-2); color: var(--muted); }
.sheet.wk .btn.solid { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.daycards { display: flex; flex-direction: column; gap: 8px; }
.daycard { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 14px; min-height: 64px; border-radius: 8px; border: 1px solid var(--line); background: var(--field); text-align: left; }
.daycard .nm { display: flex; flex-direction: column; min-width: 0; }
.daycard b { font-family: var(--font-display); font-size: 20px; font-weight: 400; }
.daycard.cur { border-color: var(--accent); background: var(--accent-soft); }

/* Food */

.center { text-align: center; }
.meal { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 14px; }
.mhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; min-height: 48px; }
.mhead > div { display: flex; flex-direction: column; }
.mhead b { font-family: var(--font-display); font-size: 20px; line-height: 1.1; }
.addbtn { border: 1px solid color-mix(in srgb, var(--food) 50%, transparent); background: color-mix(in srgb, var(--food) 10%, transparent); color: var(--food); border-radius: 6px; min-height: 36px; padding: 0 14px; font-weight: 700; font-size: 14px; }
.fentry { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 0; min-height: 52px; border: 0; border-top: 1px solid var(--line); background: transparent; text-align: left; }
.fentry .nm, .fitem .nm, .cpart .nm { min-width: 0; display: flex; flex-direction: column; }
.fmac { display: flex; flex-direction: column; align-items: flex-end; font-variant-numeric: tabular-nums; white-space: nowrap; }
.fmac b { font-family: var(--font-display); font-size: 17px; color: var(--food); }

.flist { display: flex; flex-direction: column; }
.fitem { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 2px; min-height: 56px; border: 0; border-top: 1px solid var(--line); background: transparent; text-align: left; }

.hscroll { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin-inline: -2px; padding: 2px; }
.hscroll::-webkit-scrollbar { display: none; }
.hscroll .chip { flex: none; }
.link.inline { display: inline; min-height: 0; padding: 0; }
/* bottom sheet */
body.locked { overflow: hidden; }
.sheet { position: fixed; inset: 0; z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.sheet-back { position: absolute; inset: 0; background: rgba(8, 10, 13, .6); }
.sheet-in { position: relative; width: 100%; max-width: 640px; max-height: 92vh; max-height: 92dvh; background: var(--surface); border: 1px solid var(--line-2); border-bottom: 0; border-radius: 14px 14px 0 0; display: flex; flex-direction: column; box-shadow: 0 -10px 40px rgba(0, 0, 0, .45); animation: up .2s ease-out; }

.sheet-head { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 8px; padding: 10px 12px 6px; text-align: center; }
.sheet-head h3 { font-size: 21px; }
.sheet-head > span { width: 44px; }
.sheet-body { overflow-y: auto; padding: 4px 16px calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 12px; overscroll-behavior: contain; }
.sheet-body > * { flex-shrink: 0; }
.spin { position: sticky; top: -4px; z-index: 2; margin: -4px -16px 0; padding: 4px 16px 10px; background: var(--surface); display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--line); }
.amt { display: grid; grid-template-columns: 56px 1fr 56px; gap: 10px; align-items: center; }
.amtin { width: 100%; min-height: 64px; border: 1px solid var(--line-2); border-radius: 8px; background: var(--field); color: var(--ink); text-align: center; font-family: var(--font-display); font-size: 38px; font-weight: 400; font-variant-numeric: tabular-nums; }
.amtin:focus { border-color: var(--food); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--food) 20%, transparent); }
.step { height: 56px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--surface-2); font-size: 26px; font-weight: 700; }
.seg2 { display: flex; justify-content: center; gap: 6px; }

.seg2 button[aria-pressed="true"] { background: var(--food); border-color: var(--food); color: var(--food-ink); }
.unitlab { text-align: center; margin: -4px 0 0; color: var(--muted); font-weight: 700; font-size: 14px; }
.ptiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.ptiles div { background: var(--field); border: 1px solid var(--line); border-radius: 7px; padding: 8px; display: flex; flex-direction: column; align-items: center; font-variant-numeric: tabular-nums; }
.ptiles span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-weight: 700; }
.ptiles b { font-family: var(--font-display); font-size: 24px; line-height: 1.1; }
.ptiles i { font-style: normal; font-size: 11px; color: var(--muted); }

.ptiles .hi b { color: var(--food); }
.cpart { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); }
.cin { display: flex; align-items: center; gap: 6px; flex: none; }
.cin .field { width: 84px; text-align: center; font-size: 17px; }
.cin span { font-size: 13px; color: var(--muted); min-width: 44px; }
.row4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.check { display: flex; gap: 8px; align-items: center; font-size: 14px; min-height: 40px; }
.check input { width: 20px; height: 20px; accent-color: var(--food); }
.calc { display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--line); padding-top: 12px; }
.calc .vol { grid-template-columns: repeat(4, 1fr); }
.sheet .btn.solid { background: var(--food); border-color: var(--food); color: var(--food-ink); }
.sheet .chip[aria-pressed="true"] { background: var(--food); border-color: var(--food); color: var(--food-ink); }
.sheet .field:focus-visible, .sheet .amtin:focus-visible { outline: 2px solid var(--food); }
.fsum .link, .sheet .link { color: var(--food); }
svg.chart .tg { stroke: var(--food); stroke-width: 1.5; stroke-dasharray: 4 3; }
svg.chart .bb { fill: color-mix(in srgb, var(--accent) 55%, transparent); }
svg.chart .bh { fill: var(--food); }
/* Stats: history calendar, day view, exercise history */
.calhead { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 8px; text-align: center; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal .wd { font-size: 11px; font-weight: 700; color: var(--muted); text-align: center; letter-spacing: .08em; }
.cd { aspect-ratio: 1; min-height: 40px; border-radius: 10px; border: 1px solid transparent; background: var(--field); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 0; font-variant-numeric: tabular-nums; }
.cd.empty { background: transparent; }
.cd b { font-weight: 600; font-size: 14px; line-height: 1; }
.cd i { display: flex; gap: 3px; height: 6px; }
.cd em, .callegend em { width: 6px; height: 6px; border-radius: 50%; display: inline-block; flex: none; }

.cd.w { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }

.callegend { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 13px; color: var(--muted); }

.callegend .small { margin-left: auto; }
.dvcard { display: flex; flex-direction: column; gap: 10px; }
.dvcard + .dvcard { border-top: 1px solid var(--line-2); padding-top: 14px; }
.dvhead { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }

.dvlist { display: flex; flex-direction: column; }

.dvsets .skip { color: var(--muted); font-weight: 500; font-style: italic; }
.dvrow.tap::after { content: ""; flex: none; width: 7px; height: 7px; border-right: 2px solid var(--muted); border-top: 2px solid var(--muted); transform: rotate(45deg); margin-left: -4px; }
.exlist { display: flex; flex-direction: column; }
.exh { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; min-height: 56px; border: 0; border-top: 1px solid var(--line); background: transparent; text-align: left; }
.exh .nm { min-width: 0; display: flex; flex-direction: column; }
.exh .nm b { font-weight: 600; }
.exh .fmac b { color: var(--accent); }
.exh .fmac span.up { color: var(--good); font-weight: 700; }
.exmeta { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.ptiles b.sm { font-size: 18px; line-height: 1.33; }
/* Plans: my plans and the plan builder */
.myplans { display: flex; flex-direction: column; gap: 10px; }
.mphead { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; }
.mphead .chg { margin-top: 0; }
.plan.mine .stage { color: var(--accent); }
.plan p.label { font-size: 11px; }
.brand { min-width: 0; }
.brand > div { min-width: 0; }
.brand-s { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pday { border: 1px solid var(--line); border-radius: 8px; background: var(--field); padding: 10px 10px 2px; display: flex; flex-direction: column; gap: 6px; }
.pdhead { display: flex; align-items: center; gap: 6px; }
.pdn { flex: none; width: 18px; text-align: center; font-family: var(--font-display); font-weight: 400; font-size: 19px; color: var(--accent); }
.pdhead .field { flex: 1; min-width: 0; min-height: 42px; font-weight: 700; }
.mini { flex: none; min-width: 34px; height: 36px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); font-size: 16px; font-weight: 700; display: grid; place-items: center; padding: 0 8px; }

.mini.rm { color: var(--muted); }
.pexs { display: flex; flex-direction: column; }
.pex { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); }
.pex .nm { min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; font-size: 15px; font-weight: 600; }
.pctl { display: flex; align-items: center; gap: 4px; flex: none; }
.pstep { display: flex; align-items: center; border: 1px solid var(--line-2); border-radius: 10px; overflow: hidden; background: var(--surface); }
.pstep button { width: 30px; height: 36px; border: 0; background: var(--surface-2); font-size: 18px; font-weight: 700; padding: 0; }
.pstep button[disabled] { opacity: .3; cursor: default; }
.pstep b { min-width: 32px; display: flex; flex-direction: column; align-items: center; font-family: var(--font-display); font-size: 18px; line-height: 1; font-variant-numeric: tabular-nums; }
.pstep b small { font-family: var(--font-body); font-size: 9px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; font-weight: 700; margin-top: 1px; }
.sheet.wk .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.sheet.wk .link { color: var(--accent); }
.sheet.wk .check input { accent-color: var(--accent); }
.sheet.wk .field:focus-visible { outline-color: var(--accent); }
.sheet .btn.fd { border-color: color-mix(in srgb, var(--food) 55%, transparent); color: var(--food); background: color-mix(in srgb, var(--food) 10%, transparent); }
.sheet .link.del { color: var(--eq-barbell); align-self: center; }
/* Profile button and sheet */
.avatar { position: relative; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line-2); background: var(--surface); color: var(--muted); display: grid; place-items: center; padding: 0; flex: none; }
.avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; display: block; }
.avatar svg, .acct .pic svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; }

.avatar .s { position: absolute; right: -1px; bottom: -1px; width: 11px; height: 11px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 2px var(--bg); }

.avatar .s[data-s="bad"], .sd[data-s="bad"] { background: var(--warn); }
.acct { display: grid; grid-template-columns: 60px minmax(0, 1fr); gap: 14px; align-items: center; }

.acct .pic img { width: 100%; height: 100%; object-fit: cover; }
.acct .pic svg { width: 30px; height: 30px; }

.plist { background: var(--field); border: 1px solid var(--line); border-radius: 8px; display: flex; flex-direction: column; overflow: hidden; }
.prow { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 11px 14px; min-height: 52px; border: 0; border-top: 1px solid var(--line); background: transparent; text-align: left; font-size: 15px; color: var(--ink); }
.plist > .prow:first-child { border-top: 0; }
.prow > span:first-child { min-width: 0; display: flex; flex-direction: column; }

.prow .v { color: var(--muted); font-size: 14px; text-align: right; display: inline-flex; align-items: center; gap: 7px; }
.prow.tap::after { content: ""; flex: none; width: 7px; height: 7px; border-right: 2px solid var(--muted); border-top: 2px solid var(--muted); transform: rotate(45deg); margin-right: 3px; }
.sd { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--good); }
.sd[data-s="off"] { background: var(--muted); }
.pfoot { text-align: center; font-size: 12px; color: var(--muted); margin: 6px 0 0; line-height: 1.8; }
.pfoot a { color: var(--muted); }
/* Stats */
.sumtiles i { font-size: 11px; white-space: nowrap; }
.ptiles.wk .fh { border-color: color-mix(in srgb, var(--food) 45%, transparent); }
.ptiles.wk .fh b { color: var(--food); }
.stabs { position: sticky; top: 0; z-index: 3; }
.chead { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.chip.xs { min-height: 32px; padding: 3px 12px; font-size: 13px; }
.callout { border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 10px 10px 0; padding: 10px 12px; }
.callout p { margin: 0; font-size: 14px; }
@media (max-width: 380px) { .calc .vol, .ptiles { grid-template-columns: 1fr 1fr; } .row4 { grid-template-columns: 1fr 1fr; } .rlab b { font-size: 28px; } }
/* ---- Gym look: type and shapes (kept last so it wins) ---- */
h2 { font-size: 54px; line-height: .92; letter-spacing: .01em; text-transform: uppercase; margin-top: 4px; }
h2 em, h3 em { font-style: normal; color: var(--accent); }
h3 { font-size: 27px; line-height: 1; letter-spacing: .01em; }
.sub { font-size: 15px; max-width: 46ch; }
.label, .sethead, .badge, .pill, .eqt, .stage, .timer .tl, th, .ptiles span, .cal .wd, .dmeta em, .brand-s, .rlab em, .pnum, .tag, .pfoot { font-family: var(--font-mono); }
.label { font-size: 10.5px; letter-spacing: .14em; font-weight: 700; }
.brand { gap: 12px; }
.brand svg { width: 36px; height: 36px; }
.brand-t { font-size: 30px; letter-spacing: .03em; line-height: .9; }

.row .t { font-size: 24px; letter-spacing: .01em; line-height: 1; }

.pnum { font-size: 12px; color: var(--muted); letter-spacing: .04em; }
.stage { color: var(--accent); letter-spacing: .18em; font-size: 10px; }
.plan { gap: 12px; padding: 20px; }
.plan h3 { font-size: 30px; }
.plan .why { color: var(--muted); font-size: 15px; }

.plan .pnum .stage { font-size: 10px; }
.plan .sched { font-size: 13px; }

.chip { font-weight: 600; }
.btn { font-weight: 700; letter-spacing: .02em; }

.dock { background: color-mix(in srgb, var(--bg) 96%, transparent); }

@media (min-width: 560px) { h2 { font-size: 64px; } }
/* ---- Fasting ---- */
:root { --fast: #a78bfa; }
.fastcard { border-color: color-mix(in srgb, var(--fast) 35%, transparent); background: linear-gradient(160deg, color-mix(in srgb, var(--fast) 10%, transparent), var(--surface) 60%); }

/* ---------- Stats: food this week ---------- */
function foodWeek() {
  var g = targets(), days = [], end = dnum(todayStr());
  for (var i = 6; i >= 0; i--) { var ds = dstr(end - i), tt = totals(foodDay(ds)); days.push({d: ds, p: tt.p, k: tt.kcal, n: foodDay(ds).length}); }
  var logged = days.filter(function (x) { return x.n; });
  if (!logged.length) return '<p class="empty">Log food on the Food tab and your week shows up here.</p>';
  var W = 320, H = 140, L = 30, R = 8, T = 12, B = 22, mx = Math.max(g.p * 1.25, Math.max.apply(null, days.map(function (x) { return x.p; })));
  var bw = (W - L - R) / 7, Y = function (v) { return T + (1 - v / mx) * (H - T - B); };
  var s = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Protein per day this week">';
  s += '<line class="gl" x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(0) + '" y2="' + Y(0) + '"/><line class="tg" x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(g.p) + '" y2="' + Y(g.p) + '"/><text x="' + (L - 4) + '" y="' + (Y(g.p) + 3) + '" text-anchor="end">' + g.p + '</text>';
  days.forEach(function (x, i) {
    var cx = L + i * bw + bw * .18, w = bw * .64, y = Y(x.p), dd = new Date(dnum(x.d) * 864e5);
    s += '<rect class="' + (x.p >= g.p ? "bh" : "bb") + '" x="' + cx.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + w.toFixed(1) + '" height="' + Math.max(0, Y(0) - y).toFixed(1) + '" rx="3"/>';
    s += '<text x="' + (cx + w / 2).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle">' + ["S","M","T","W","T","F","S"][dd.getUTCDay()] + '</text>';
    if (x.n) s += '<text class="ev" x="' + (cx + w / 2).toFixed(1) + '" y="' + (y - 4).toFixed(1) + '" text-anchor="middle">' + r0(x.p) + '</text>';
  });
  s += '</svg>';
  var avgP = logged.reduce(function (a, x) { return a + x.p; }, 0) / logged.length, avgK = logged.reduce(function (a, x) { return a + x.k; }, 0) / logged.length;
  var hit = logged.filter(function (x) { return x.p >= g.p * .95; }).length;
  return s + '<div class="vol"><div><span>Avg protein</span><b>' + r0(avgP) + ' g</b></div><div><span>Avg calories</span><b>' + r0(avgK) + '</b></div><div><span>Protein goal hit</span><b>' + hit + ' / ' + logged.length + '</b></div></div><p class="small">Grams of protein per day for the last 7 days. The line is your target.</p>';
}

/* ---------- Themes (Profile → Theme). Colours live in CSS under :root[data-theme]. ---------- */
var THEMES = [["volt", "Volt", "Lime + orange", "#c8f542", "#ff8a3d", "#0b0c0e"], ["miami", "Miami", "Pink + teal", "#ff4fa3", "#2ee6d6", "#0b0c0e"], ["ember", "Ember", "Red + amber", "#ff5a36", "#ffc145", "#0b0c0e"],
  ["ocean", "Ocean", "Aqua + coral", "#2ee6c5", "#ff7a6b", "#0b0c0e"], ["violet", "Ultraviolet", "Violet + pink", "#a78bfa", "#ff6fb5", "#0b0c0e"], ["gold", "Gold rush", "Gold + red", "#ffd23f", "#ff6b6b", "#0b0c0e"],
  ["mono", "Mono", "White + amber", "#f2f2ec", "#ffb547", "#0b0c0e"], ["daylight", "Daylight", "Light, green + orange", "#4f8a10", "#e2600f", "#f2f3ef"]];
var curTheme = null;
function themeOk(v) { return THEMES.some(function (t) { return t[0] === v; }) ? v : "volt"; }
function applyTheme(v) {
  v = themeOk(v); if (v === curTheme) return; curTheme = v;
  var r = document.documentElement;
  if (v === "volt") r.removeAttribute("data-theme"); else r.setAttribute("data-theme", v);
  try { localStorage.setItem("neongym.theme", v); } catch (e) {}
  var m = document.querySelector('meta[name="theme-color"]'), bg = (THEMES.filter(function (t) { return t[0] === v; })[0] || THEMES[0])[5];
  if (m) m.setAttribute("content", bg);
}
function setTheme(v) { S.profile.theme = themeOk(v); applyTheme(S.profile.theme); mark("profile"); }
function themePicker() {
  var cur = themeOk(S.profile.theme);
  return '<div class="themes">' + THEMES.map(function (t) {
    return '<button class="thm" type="button" data-act="theme" data-v="' + t[0] + '" aria-pressed="' + (cur === t[0]) + '"><i class="sw" style="background:linear-gradient(135deg,' + t[3] + ' 50%,' + t[4] + ' 50%);border-color:' + t[5] + '"></i><span><b>' + t[1] + '</b><small>' + t[2] + '</small></span></button>';
  }).join("") + '</div>';
}
function render(keepScroll) {
  var y = window.scrollY;
  var v = UI.tab === "today" ? viewToday() : UI.tab === "food" ? viewFood() : UI.tab === "water" ? viewWater() : UI.tab === "plans" ? viewPlans() : UI.tab === "progress" ? viewProgress() : viewGuide();
  $("view").innerHTML = v;
  $("eyebrow").textContent = PLANS[S.profile.plan].n + " plan";
  Array.prototype.forEach.call(document.querySelectorAll("#nav button"), function (b) { b.setAttribute("aria-selected", b.getAttribute("data-tab") === UI.tab); });
  var gbtn = $("guideBtn"); if (gbtn) gbtn.setAttribute("aria-pressed", UI.tab === "guide");
  var fp = $("finPill"), fs = S.sessions[curKey()];
  if (fp) { fp.hidden = UI.tab !== "today" || !!(fs && fs.finished); fp.classList.toggle("go", !!(fs && hasDone(fs))); }
  applyTheme(S.profile.theme);
  window.scrollTo(0, keepScroll ? y : 0);
  if (UI.tab === "water") animWater(); else UI.wLevel = null;
}

/* ---------- Toast and rest timer ---------- */
var toastT = null;
function toast(t) { var el = $("toast"); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(function () { el.hidden = true; }, 2200); }
var T = {end: 0, iv: null, fired: false};
function startRest(sec) { T.end = Date.now() + sec * 1000; T.fired = false; $("timerBar").hidden = false; $("timerBar").classList.remove("go"); if (!T.iv) T.iv = setInterval(tick, 250); tick(); saveUI(); }
function hideTimer() { $("timerBar").hidden = true; clearInterval(T.iv); T.iv = null; if (T.end > Date.now()) { T.end = 0; saveUI(); } }
function tick() {
  var left = Math.ceil((T.end - Date.now()) / 1000);
  if (left > 0) { $("timerTxt").textContent = mmss(left); return; }
  if (!T.fired) { T.fired = true; $("timerTxt").textContent = "Go"; $("timerBar").classList.add("go"); try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) {} setTimeout(hideTimer, 6000); }
}

/* ---------- Backup codes ---------- */
function exportCode() {
  var json = JSON.stringify({v: 1, app: "neon-gym", data: S});
  try { return "NG1." + btoa(unescape(encodeURIComponent(json))); } catch (e) { return ""; }
}
function importCode(code) {
  code = String(code || "").trim();
  if (code.indexOf("NG1.") !== 0) return false;
  try {
    var o = JSON.parse(decodeURIComponent(escape(atob(code.slice(4)))));
    if (!o || o.app !== "neon-gym" || !o.data || !o.data.profile) return false;
    S = o.data; fixProfile(); markAll(); return true;
  } catch (e) { return false; }
}

/* ---------- Events ---------- */
document.addEventListener("toggle", function (ev) {
  var d = ev.target; if (d && d.getAttribute && d.getAttribute("data-k")) { UI.open[d.getAttribute("data-k")] = d.open; saveUI(); }
}, true);
document.addEventListener("change", function (ev) {

});
document.addEventListener("input", function (ev) {
  var t = ev.target;
  if (t.classList.contains("setin")) {
    var s = ensureSess(), id = t.getAttribute("data-ex"), i = +t.getAttribute("data-i"), arr = s.sets[id] = s.sets[id] || [];
    while (arr.length <= i) arr.push({});
    arr[i][t.getAttribute("data-f")] = t.value;
    mark("session", curKey());
  } else if (t.id === "fsearch") { if (UI.sheet) { UI.sheet.q = t.value; renderFoodList(); }
  } else if (t.id === "exq") { if (UI.sheet) { UI.sheet.q = t.value; renderExList(); }
  } else if (t.id === "famt") { updatePreview();
  } else if (t.classList.contains("camt")) { var pt = UI.sheet.parts[+t.getAttribute("data-i")]; pt.amt = num(t.value) || 0; var cp = $("cpreview"); if (cp) cp.innerHTML = previewTiles(comboTotals());
  } else if (t.id === "pname" && UI.sheet && UI.sheet.draft) { UI.sheet.draft.n = t.value;
  } else if (t.classList.contains("dname") && UI.sheet && UI.sheet.draft) { var dx = UI.sheet.draft.days[+t.getAttribute("data-i")]; if (dx) dx.n = t.value;
  } else if (t.classList.contains("note")) { S.profile.notes[t.getAttribute("data-ex")] = t.value; mark("profile"); }
});
function itemFor(id, s) { return fullList(curDay(), s).filter(function (q) { return q.id === id; })[0]; }
document.addEventListener("keydown", function (ev) {
  if (ev.key === "Escape" && UI.sheet) closeSheet();
  if (ev.key === "Enter" && (ev.target.id === "fsearch" || ev.target.id === "exq")) ev.target.blur();
  if (ev.key === "Enter" && UI.sheet && ev.target.id === "famt") { var bt = document.querySelector('[data-act="aadd"],[data-act="asave"]'); if (bt) bt.click(); }
});
document.addEventListener("click", function (ev) {
  var b = ev.target.closest("[data-act]");
  if (!b || b.disabled) return;
  var a = b.getAttribute("data-act"), id = b.getAttribute("data-ex");
  if (a !== "clear") UI.confirmClear = false;
  if (a !== "import") UI.confirmImport = false;
  if (planClick(a, b) || histClick(a, b) || waterClick(a, b) || fastClick(a, b) || foodClick(a, b)) return;
  if (a === "fastopen") { UI.tab = "food"; UI.fdate = todayStr(); if (UI.sheet) closeSheet(); render(false); saveUI(); return; }
  if (a === "tab") { UI.tab = b.getAttribute("data-tab"); if (UI.sheet) closeSheet(); render(false); saveUI(); }
  else if (a === "extab") { UI.extab = UI.extab || {}; UI.extab[id] = b.getAttribute("data-v"); saveUI(); render(true); }
  else if (a === "daypick") { openSheet({mode: "daypick"}); }
  else if (a === "profile") { openSheet({mode: "profile"}); }
  else if (a === "ptab") { UI.tab = b.getAttribute("data-tab"); closeSheet(); render(false); saveUI(); }
  else if (a === "psignin") { var ncI = ncOn(); if (ncI) ncI.signIn().catch(function (e) { toast("Sign-in didn't work. " + (((e && e.message) || e) + "").slice(0, 80)); }); }
  else if (a === "psignout") {
    if (!UI.sheet.confirmOut) { UI.sheet.confirmOut = true; renderSheet(); return; }
    var ncO = ncOn(); if (ncO) ncO.signOut().then(function () { toast("Signed out. Your log stays in your account."); });
  }
  else if (a === "stab") { UI.statTab = b.getAttribute("data-v"); render(true); saveUI(); }
  else if (a === "bchart") { UI.bchart = b.getAttribute("data-v"); render(true); }
  else if (a === "pickday") {
    var pd = b.getAttribute("data-d"); UI.day = null;
    S.profile.todayPick = {date: todayStr(), day: pd}; mark("profile"); closeSheet(); render(false);
    toast("Today: " + DAYS[pd].n);
  }
  else if (a === "finish") {
    var sf = S.sessions[curKey()];
    if (!sf || !hasDone(sf)) { toast("Tick at least one exercise or set first"); return; }
    openSheet({mode: "finish"});
  }
  else if (a === "finyes") {
    var sy = S.sessions[curKey()], dy = curDay();
    if (sy) {
      sy.finished = true; sy.finishedAt = Date.now();
      sy.skipped = sessStats(dy, sy).left.map(function (it) { return it.id; });
      mark("session", curKey());
    }
    hideTimer(); closeSheet(); render(false);
    try { if (navigator.vibrate) navigator.vibrate([60, 60, 120]); } catch (e) {}
    toast("Workout saved. Nice work.");
  }
  else if (a === "reopen") { var sr = S.sessions[curKey()]; if (sr) { delete sr.finished; delete sr.finishedAt; delete sr.skipped; mark("session", curKey()); } render(false); }
  else if (a === "extick") {
    var s0 = ensureSess(), it0 = itemFor(id, s0), was = exDone(it0, s0);
    if (was) { s0.done[id] = false; (s0.sets[id] || []).forEach(function (r) { if (r) r.d = false; }); }
    else {
      s0.done[id] = true;
      (s0.sets[id] || []).forEach(function (r) { if (r && r.r !== undefined && r.r !== "") r.d = true; });
      var lst = fullList(curDay(), s0).filter(function (q) { return !q.core; });
      toast(lst.every(function (q) { return exDone(q, s0); }) ? "All done. Tap Finish workout to save it." : BY[id].n + " done");
    }
    mark("session", curKey()); render(true);
  }
  else if (a === "tick") {
    var s = ensureSess(), i = +b.getAttribute("data-i"), e = BY[id], arr = s.sets[id] = s.sets[id] || [];
    while (arr.length <= i) arr.push({});
    var r = arr[i];
    if (r.d) { r.d = false; s.done[id] = false; }
    else {
      if (!e.bw && (r.w == null || r.w === "") && b.getAttribute("data-pw")) r.w = b.getAttribute("data-pw");
      if ((r.r == null || r.r === "") && b.getAttribute("data-pr")) r.r = b.getAttribute("data-pr");
      if (r.r == null || r.r === "") { toast("Enter your " + (e.unit === "sec" ? "seconds" : "reps") + " first"); return; }
      r.d = true;
      var it = itemFor(id, s), pr = isBest(e, curKey(), r);
      if (it && exDone(it, s)) { s.done[id] = true; toast(pr ? "New best set: " + bestTxt(e, pr) + ". " + e.n + " done" : e.n + " done"); }
      else { startRest(e.rs); if (pr) toast("New best set: " + bestTxt(e, pr)); }
    }
    mark("session", curKey()); render(true);
  }
  else if (a === "addset") { var s2 = ensureSess(), ar = s2.sets[id] = s2.sets[id] || [], it2 = itemFor(id, s2); while (ar.length < (it2 ? it2.sets : 0)) ar.push({}); ar.push({}); s2.done[id] = false; mark("session", curKey()); render(true); }
  else if (a === "pick") {
    var d = curDay(), slot = b.getAttribute("data-slot"), cid = b.getAttribute("data-id"), s3 = ensureSess();
    var curIt = fullList(d, s3).filter(function (q) { return q.slot === slot; })[0], oldId = curIt ? curIt.id : null;
    if (oldId === cid) return;
    s3.picks[slot] = cid; S.profile.pick[d + ":" + slot] = cid; if (slot === "core") { s3.core = cid; S.profile.core[d] = cid; }
    UI.open["ex-" + cid] = !!UI.open["ex-" + oldId];
    mark("session", curKey()); mark("profile"); render(true); toast("Switched to " + BY[cid].n);
  }
  else if (a === "opennote") { UI.open["note-" + id] = true; render(true); var f = document.querySelector('.note[data-ex="' + id + '"]'); if (f) f.focus(); }
  else if (a === "exaddopen") { openSheet({mode: "todayadd", grp: UI.addGroup || "Chest", eqf: UI.addEq || "all", q: ""}); }
  else if (a === "taeq") { UI.addEq = UI.sheet.eqf = b.getAttribute("data-v"); renderSheet(); }
  else if (a === "tagrp") { UI.addGroup = UI.sheet.grp = b.getAttribute("data-g"); renderSheet(); }
  else if (a === "add") { var s5 = ensureSess(); if (!itemFor(id, s5)) { s5.extras.push({id: id, sets: BY[id].g === "Core" ? 2 : BY[id].rs >= 105 ? 3 : 2}); mark("session", curKey()); toast("Added " + BY[id].n); } render(true); if (UI.sheet && UI.sheet.mode === "todayadd") renderExList(); }
  else if (a === "theme") { setTheme(b.getAttribute("data-v")); renderSheet(); }
  else if (a === "rmextra") { var s6 = ensureSess(); s6.extras = s6.extras.filter(function (q) { return q.id !== id; }); delete s6.sets[id]; delete s6.done[id]; mark("session", curKey()); render(true); }
  else if (a === "clear") {
    if (!UI.confirmClear) { UI.confirmClear = true; render(true); return; }
    UI.confirmClear = false; var k = curKey();
    if (S.sessions[k]) { delete S.sessions[k]; mark("session", k); }
    render(true); toast("Cleared");
  }
  else if (a === "plan") { S.profile.plan = b.getAttribute("data-p"); UI.day = null; delete S.profile.todayPick; mark("profile"); render(true); toast("Plan: " + PLANS[S.profile.plan].n + ". Today now follows it."); }
  else if (a === "savebody") {
    var dd = $("bdate").value || todayStr(), kg = num($("bkg").value), wa = num($("bwaist").value);
    if (kg == null && wa == null) { toast("Enter a weight or a waist size"); return; }
    var cur = S.body[dd] || {}; if (kg != null) cur.kg = kg; if (wa != null) cur.waist = wa;
    S.body[dd] = cur; mark("body", dd); render(true); toast("Saved " + fmtD(dd));
  }
  else if (a === "delbody") { var d2 = b.getAttribute("data-d"); if (UI.del === d2) { delete S.body[d2]; UI.del = null; mark("body", d2); } else UI.del = d2; render(true); }
  else if (a === "export") {
    var code = exportCode(), ta = $("impcode");
    var fallback = function () { ta.value = code; ta.focus(); ta.select(); toast("Code shown below. Copy it from the box."); };
    try { navigator.clipboard.writeText(code).then(function () { toast("Backup code copied"); }, fallback); } catch (e) { fallback(); }
  }
  else if (a === "import") {
    var v = $("impcode").value;
    if (!v.trim()) { toast("Paste a backup code first"); return; }
    var redraw = function () { if (UI.sheet) renderSheet(); else render(true); };
    if (!UI.confirmImport) { UI.confirmImport = true; var keep = v; redraw(); $("impcode").value = keep; return; }
    UI.confirmImport = false;
    if (importCode(v)) { closeSheet(); render(true); toast("Backup loaded"); } else { redraw(); toast("That code didn't work. Copy the whole code and try again."); }
  }
  else if (a === "t15") { T.end += 15000; T.fired = false; $("timerBar").classList.remove("go"); if (!T.iv) T.iv = setInterval(tick, 250); tick(); saveUI(); }
  else if (a === "tskip") { hideTimer(); }
});

cacheLoad();
restoreUI();
setSync("local");
paintAvatar();
render(false);
(function () {
  var hd = document.querySelector("header.top"); if (!hd) return;
  var setHH = function () { document.documentElement.style.setProperty("--hh", hd.offsetHeight + "px"); };
  setHH(); window.addEventListener("resize", setHH);
  window.addEventListener("scroll", function () { hd.classList.toggle("scrolled", window.scrollY > 4); }, {passive: true});
})();
fastStartTimer();
if (/[?&#]fastend=1/.test(location.href) && fasting()) endFast();
connect();
if ("serviceWorker" in navigator && document.querySelector('link[rel="manifest"]')) {
  try { navigator.serviceWorker.register("sw.js").catch(function () {}); } catch (e) {}
}
})();
</script>
